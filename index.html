
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Prasad Tours & Travels</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #222;
}

header {
  background: #102a56;
  color: white;
  text-align: center;
  padding: 25px 12px;
}

header h1 { margin: 0 0 10px; }

.hero {
  background: white;
  text-align: center;
  padding: 25px 12px;
}

.car { font-size: 65px; }

.container {
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 14px;
}

h2 {
  text-align: center;
  color: #102a56;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #bbb;
  border-radius: 7px;
  font-size: 16px;
}

button, .btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.whatsapp { background: #168b45; }
.call { background: #102a56; }

footer {
  background: #102a56;
  color: white;
  text-align: center;
  padding: 18px;
}

.note {
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>

<header>
  <h1>Sai Prasad Tours & Travels</h1>
  <p>Your Journey, Our Responsibility</p>
</header>

<section class="hero">
  <div class="car">🚘</div>
  <h2>Book Your Car</h2>
  <p>आरामदायी प्रवासासाठी आजच बुकिंग करा!</p>
</section>

<div class="container">
  <h2>Booking Form</h2>

  <form id="bookingForm">

    <label for="name">तुमचे नाव *</label>
    <input id="name" type="text"
      placeholder="पूर्ण नाव लिहा" required>

    <label for="phone">तुमचा मोबाईल नंबर *</label>
    <input id="phone" type="tel"
      inputmode="numeric" pattern="[0-9]{10}"
      maxlength="10" placeholder="10 अंकी नंबर" required>

    <label for="from">कुठून जायचे? *</label>
    <input id="from" type="text"
      placeholder="उदा. कोपरगाव" required>

    <label for="to">कुठे जायचे? *</label>
    <input id="to" type="text"
      placeholder="उदा. पुणे" required>

    <label for="date">प्रवासाची तारीख *</label>
    <input id="date" type="date" required>

    <label for="car">गाडी निवडा</label>
    <select id="car">
      <option>Swift Dzire</option>
      <option>Hatchback Car</option>
      <option>Sedan Car</option>
      <option>SUV</option>
      <option>Other Car</option>
    </select>

    <label for="details">अधिक माहिती</label>
    <textarea id="details" rows="3"
      placeholder="प्रवासी संख्या किंवा इतर माहिती"></textarea>

    <button type="submit" class="whatsapp">
      WhatsApp वर बुकिंग करा
    </button>

  </form>

  <a class="btn call" href="tel:+919284428010">
    📞 फोन करून बुकिंग करा
  </a>

  <p class="note">
    WhatsApp वर बुकिंगची विनंती पाठवल्यानंतर
    बुकिंग निश्चित करण्यासाठी संपर्क केला जाईल.
  </p>
</div>

<footer>
  <p>© Sai Prasad Tours & Travels</p>
  <p>Contact: 9284428010</p>
</footer>

<script>
const BUSINESS_NUMBER = "919284428010";

const dateInput = document.getElementById("date");
const now = new Date();
dateInput.min = new Date(
  now.getTime() - now.getTimezoneOffset() * 60000
).toISOString().split("T")[0];

document.getElementById("bookingForm").addEventListener(
  "submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const from = document.getElementById("from").value.trim();
    const to = document.getElementById("to").value.trim();
    const date = dateInput.value;
    const car = document.getElementById("car").value;
    const details = document.getElementById("details").value.trim();

    if (!/^[0-9]{10}$/.test(phone)) {
      alert("10 अंकी मोबाईल नंबर टाका.");
      return;
    }

    const message =
      "SAI PRASAD TOURS & TRAVELS - BOOKING REQUEST\n\n" +
      "Name: " + name + "\n" +
      "Customer Mobile: " + phone + "\n" +
      "Pickup: " + from + "\n" +
      "Destination: " + to + "\n" +
      "Travel Date: " + date + "\n" +
      "Car: " + car + "\n" +
      "Details: " + (details || "None");

    const url = "https://wa.me/" + BUSINESS_NUMBER +
      "?text=" + encodeURIComponent(message);

    window.location.href = url;
  }
);
</script>

</body>
</html>
